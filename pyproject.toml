[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-arise"
version = "2.0.0"
description = "A terminal UI for inspecting, cleaning, and reporting on datasets"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.70",
    "rich>=13",
    "pandas>=2",
    "openpyxl>=3",
    "xlrd>=2",
    "pyarrow>=12",
]

[project.scripts]
dataset-arise = "dataset_cleaner.app:main"

[tool.setuptools.packages.find]
include = ["dataset_cleaner*"]
